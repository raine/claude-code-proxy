name: Claude Code compatibility canary

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated manifest versions; first entry is also tested on macOS (blank uses latest,previous)"
        required: false
        type: string
  schedule:
    - cron: "23 6 * * 2"

permissions:
  contents: read

jobs:
  ubuntu-latest-and-previous:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Run pinned compatibility canary
        env:
          VERSION_OVERRIDE: ${{ inputs.versions }}
        run: |
          if [[ -n "$VERSION_OVERRIDE" ]]; then
            scripts/claude-code-launcher-smoke --versions "$VERSION_OVERRIDE"
          else
            scripts/claude-code-launcher-smoke
          fi

  macos-latest:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Run latest pinned compatibility canary
        env:
          VERSION_OVERRIDE: ${{ inputs.versions }}
        run: |
          if [[ -n "$VERSION_OVERRIDE" ]]; then
            scripts/claude-code-launcher-smoke --versions "${VERSION_OVERRIDE%%,*}"
          else
            latest="$(
              python3 -c 'import json; print(json.load(open("compatibility/claude-code.json"))["launcherSmoke"]["latest"]["version"])'
            )"
            scripts/claude-code-launcher-smoke --versions "$latest"
          fi
